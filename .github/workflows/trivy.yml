name: Trivy Security Scan

# Standalone scan, deliberately NOT the shared wooclap/devx reusable workflow:
# this repository is public and wooclap/devx is private. GitHub refuses to start
# a run that calls a reusable workflow from a private repository, so every run of
# the shared workflow failed here with zero jobs. External contributors also open
# PRs from forks, which never receive secrets, so this workflow must not need any.
#
# Like the devx workflow, it uploads the JSON report as the `trivy-results`
# artifact and posts a sticky PR comment. Unlike it, there is no PR-vs-base diff:
# the comment lists every finding in the branch.
#
# This repository is public, so its logs, artifacts and PR comments are public:
# secret findings are reported by file path only, and Code/Match are stripped
# from the JSON report before upload.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky PR comment only
    env:
      SEVERITY: CRITICAL,HIGH
      TRIVY_DISABLE_VEX_NOTICE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6

      - name: Run Trivy scan
        run: |
          set -uo pipefail

          # Full JSON report, all scanners. Secret Code/Match are stripped right
          # away: the report is uploaded as an artifact, which is public here.
          if ! trivy repo --scanners vuln,misconfig,secret,license --severity "$SEVERITY" \
              --exit-code 0 --format json --output trivy-results.json . 2>/dev/null; then
            echo "::error::Trivy scan failed to run."
            rm -f trivy-results.json
            exit 1
          fi
          jq '(.Results[]? | select(.Secrets) | .Secrets) |= map(del(.Code, .Match))' \
            trivy-results.json > trivy-results.redacted.json
          mv trivy-results.redacted.json trivy-results.json

          echo "::group::Vulnerabilities, misconfigurations, licenses"
          trivy repo --scanners vuln,misconfig,license --severity "$SEVERITY" --exit-code 0 .
          echo "::endgroup::"

          secret_files="$(jq -r '.Results[]? | select((.Secrets // []) | length > 0) | .Target' trivy-results.json | sort -u)"
          if [[ -n "$secret_files" ]]; then
            echo "::error::Secrets detected in the following files (values not shown; run 'trivy repo --scanners secret .' locally):"
            echo "$secret_files" | sed 's/^/  - /'
          fi

          findings="$(jq '[.Results[]? |
            ((.Vulnerabilities // []) | length) +
            ((.Misconfigurations // []) | map(select(.Status == "FAIL")) | length) +
            ((.Secrets // []) | length) +
            (if .Class == "license" then ((.Licenses // []) | length) else 0 end)
          ] | add // 0' trivy-results.json)"
          if [[ "$findings" -gt 0 ]]; then
            echo "::error::Trivy found ${findings} security findings ($SEVERITY)."
            exit 1
          fi
          echo "No findings ($SEVERITY)."

      - name: Compress JSON results
        if: always()
        run: |
          if [[ -f trivy-results.json ]]; then
            gzip -k trivy-results.json
          fi

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json.gz
          if-no-files-found: warn

      - name: Prepare Trivy PR comment
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/trivy-pr-comment.mjs
          cat trivy-comment.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token: they skip the comment and rely on the
      # job summary written above.
      - name: Create or update Trivy PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          path: trivy-comment.md
